<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" aria-label="Cán cân công lý">
  <style>
    .beam{transform-origin:200px 92px;animation:tilt 5s ease-in-out infinite}
    .panL{animation:keepL 5s ease-in-out infinite;transform-origin:110px 92px}
    .panR{animation:keepR 5s ease-in-out infinite;transform-origin:290px 92px}
    @keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    @keyframes keepL{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}
    @keyframes keepR{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}
    .glow{animation:pulse 5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.7}}
    .line{stroke-dasharray:60;stroke-dashoffset:60;animation:write 6s ease-in-out infinite}
    .l2{animation-delay:.6s}.l3{animation-delay:1.2s}.l4{animation-delay:1.8s}
    @keyframes write{0%{stroke-dashoffset:60}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:60}}
  </style>
  <circle class="glow" cx="200" cy="150" r="128" fill="#1e3a8a"/>
  <!-- document stack -->
  <g transform="translate(18 178) rotate(-8)">
    <rect x="6" y="6" width="96" height="120" rx="8" fill="#334155"/>
    <rect width="96" height="120" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="14" y="14" width="40" height="7" rx="3.5" fill="#60a5fa"/>
    <path class="line" d="M14 36h66" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path class="line l2" d="M14 52h60" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path class="line l3" d="M14 68h66" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path class="line l4" d="M14 84h44" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="74" cy="102" r="10" fill="none" stroke="#f87171" stroke-width="2.5"/>
    <path d="M69 102l3.5 3.5 6-7" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- gavel -->
  <g transform="translate(300 236) rotate(-30)">
    <rect x="-6" y="0" width="12" height="62" rx="5" fill="#a16207"/>
    <rect x="-26" y="-22" width="52" height="24" rx="7" fill="#7c4a1e"/>
    <rect x="-30" y="-20" width="8" height="20" rx="3" fill="#60a5fa"/>
    <rect x="22" y="-20" width="8" height="20" rx="3" fill="#60a5fa"/>
  </g>
  <rect x="270" y="286" width="90" height="14" rx="5" fill="#7c4a1e"/>
  <!-- scale -->
  <rect x="194" y="92" width="12" height="178" rx="5" fill="#fbbf24"/>
  <path d="M160 282h80l-10-16h-60z" fill="#fbbf24"/>
  <rect x="148" y="280" width="104" height="12" rx="5" fill="#f59e0b"/>
  <circle cx="200" cy="80" r="13" fill="#60a5fa"/>
  <g class="beam">
    <rect x="96" y="86" width="208" height="12" rx="6" fill="#f59e0b"/>
    <circle cx="200" cy="92" r="9" fill="#60a5fa"/>
    <g class="panL">
      <path d="M110 92 84 168M110 92l26 76" stroke="#fcd34d" stroke-width="2.5"/>
      <path d="M70 168h80a40 22 0 0 1-80 0z" fill="#fbbf24"/>
    </g>
    <g class="panR">
      <path d="M290 92l-26 76M290 92l26 76" stroke="#fcd34d" stroke-width="2.5"/>
      <path d="M250 168h80a40 22 0 0 1-80 0z" fill="#fbbf24"/>
    </g>
  </g>
  <!-- sparkles -->
  <g fill="#60a5fa">
    <path class="glow" d="M330 46l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path class="glow" d="M58 70l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" style="animation-delay:2.5s"/>
  </g>
</svg>
